<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentín para Jasmine</title>
    <style>
        body {
            background-color: #87CEEB; /* Celeste */
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .contenedor {
            margin-top: 50px;
        }
        img {
            width: 200px;
        }
        .boton {
            background-color: pink;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            border-radius: 15px;
            transition: 0.3s;
        }
        .boton:hover {
            background-color: #ff69b4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>¿Quieres ser mi San Valentín, Jhazmin Mikaela Ledezma Mendoza? 💖💖💖</h1>
        <br><br>
        <button class="boton" onclick="aceptar()">Sí</button>
        <button class="boton" onclick="rechazar()">No</button>
    </div>

    <script>
        function aceptar() {
            alert("Sabía que aceptarías, mi amor. Te amo mi vida :) ❤");
        }
        function rechazar() {
            alert("Esta opción no existe para ti, niñita, tu eres mia y solo mia para siempre okei.");
        }
    </script>
</body>
</html>
